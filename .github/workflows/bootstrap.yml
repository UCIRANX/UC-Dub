name: Bootstrap unzip

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip into repo root
        id: extract
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found."
            exit 0
          fi
          for z in "${zips[@]}"; do
            tmp=$(mktemp -d)
            unzip -q "$z" -d "$tmp"
            entries=("$tmp"/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            cp -a "$src"/. .
            rm -rf "$tmp" "$z"
          done
          echo "extracted=true" >> "$GITHUB_OUTPUT"

      - name: Commit and start build
        if: steps.extract.outputs.extracted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded archive [skip ci]" || echo "Nothing to commit."
          git push origin HEAD:main
          gh workflow run android.yml --ref main
